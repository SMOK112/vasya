<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Вася</title>
<style>
  :root { --bg:#111214; --card:#1b1d21; --text:#eef0f3; --dim:#8b9099; --acc:#ffb020; --me:#2b6fff; --red:#ff4d4d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; padding:16px; padding-bottom:max(16px,env(safe-area-inset-bottom)); gap:12px; }
  header { display:flex; align-items:center; gap:12px; }
  #dot { width:14px; height:14px; border-radius:50%; background:var(--dim); flex:none; transition:background .2s, transform .1s; }
  #dot.on { background:#2ecc71; } #dot.wake { background:#4d8bff; box-shadow:0 0 12px #4d8bff; } #dot.talk { background:var(--acc); } #dot.off { background:var(--red); }
  h1 { margin:0; font-size:22px; }
  #status { color:var(--dim); font-size:14px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:14px; background:var(--card); word-wrap:break-word; }
  .msg.me { align-self:flex-end; background:var(--me); }
  .msg b { display:block; font-size:12px; color:var(--dim); font-weight:600; }
  .msg.me b { color:#cfe0ff; }
  .row { display:flex; gap:10px; }
  button { flex:1; font:600 18px system-ui,sans-serif; padding:18px; border:0; border-radius:16px; color:#111; background:var(--acc); }
  button:disabled { opacity:.35; }
  #stop { background:var(--card); color:var(--text); }
  #hint { color:var(--dim); font-size:13px; text-align:center; }
  .vol { display:flex; align-items:center; gap:10px; color:var(--dim); font-size:14px; }
  .vol input { flex:1; accent-color:var(--acc); }
  /* выключенное превью не прячем через display:none — иначе Android не отдаёт кадры */
  #cam { position:fixed; right:0; bottom:0; width:4px; height:4px; opacity:0; pointer-events:none; }
  #cam.on { position:static; width:100%; height:auto; max-height:32vh; opacity:1; object-fit:cover; border-radius:14px; background:#000; }
  #smart { flex:2; background:#7c4dff; color:#fff; }
  #mute { background:var(--card); color:var(--text); }
  #mute.on { background:var(--red); color:#fff; }
  .txtrow input { flex:1; min-width:0; font:16px system-ui,sans-serif; padding:14px; border-radius:14px;
    border:1px solid #333; background:var(--card); color:var(--text); }
  .txtrow button { flex:none; padding:14px 18px; }
  #talk { flex:2; background:var(--me); color:#fff; display:none; user-select:none; -webkit-user-select:none; touch-action:none; }
  #talk.down { background:#ff4d4d; transform:scale(.97); }
  .msg img { display:block; max-width:100%; border-radius:10px; margin-top:4px; }
  #camBtn.on { background:var(--acc); color:#111; }
  #look, #camBtn, #bg { background:var(--card); color:var(--text); }
  #bg.on { background:#2ecc71; color:#111; }
  #glassesBtn { background:var(--card); color:var(--text); }
  #glassesBtn.on { background:#2ecc71; color:#111; }
  #glassesInfo { font-size:12px; color:var(--dim); align-self:center; flex:1; }
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <div><h1>Вася</h1><div id="status">Жми «Погнали» и разреши микрофон</div></div>
</header>
<div id="log"></div>
<video id="cam" playsinline muted></video>
<div class="vol">Громкость <input id="vol" type="range" min="0" max="100" value="20"></div>
<div class="row">
  <button id="camBtn" disabled>Камера</button>
  <button id="look" disabled>Глянь</button>
  <button id="bg" disabled>Фон</button>
</div>
<div class="row">
  <button id="glassesBtn" disabled>📷 Очки: выкл</button>
  <span id="glassesInfo">Фото: телефон</span>
</div>
<div class="row">
  <button id="smart" disabled>Разберись</button>
  <button id="mute" disabled>Без звука</button>
</div>
<div class="row txtrow">
  <input id="txt" placeholder="Напиши Васе…" autocomplete="off" enterkeyhint="send">
  <button id="send" disabled>➤</button>
</div>
<div class="row">
  <button id="go">Погнали</button>
  <button id="talk">Держи и говори</button>
  <button id="stop" disabled>Заткнись</button>
</div>
<div id="hint">Молча: «Разберись» — сам поймёт, чем помочь. Или напиши. Голосом: «Вась» — дзынь — говори.</div>

<script>
const $ = id => document.getElementById(id);
let chain = Promise.resolve(), speechQ = 0;
let ctx, ws, stream, out, nextT = 0, sources = [], wake = null, mutedUntil = 0;
let cam = null, camOn = false, bgOn = false, bgTimer = null, lastThumb = null, BG_INT = 30;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
// ключ доступа приходит в ссылке (?k=...) один раз, дальше помним его на телефоне
let KEY = (new URLSearchParams(location.search).get('k') || store('vasya_key') || '').trim();
if (KEY) { store('vasya_key', KEY); if (location.search) history.replaceState(null, '', location.pathname); }

function status(t) { $('status').textContent = t; }
function dot(c) { $('dot').className = c || ''; }
function addLog(who, text, img) {
  const d = document.createElement('div');
  d.className = 'msg' + (who === 'Ты' ? ' me' : '');
  d.innerHTML = '<b></b><span></span>';
  d.firstChild.textContent = who; d.lastChild.textContent = text;
  if (img) { const i = document.createElement('img'); i.src = img; d.appendChild(i); }
  $('log').appendChild(d);
  while ($('log').children.length > 100) $('log').firstChild.remove();
  $('log').scrollTop = $('log').scrollHeight;
}

// кусочек кода, который крутится в звуковом потоке и режет микрофон по 50 мс
const WORKLET = `
class Cap extends AudioWorkletProcessor {
  constructor(o) { super(); this.n = o.processorOptions.n; this.buf = new Float32Array(this.n); this.i = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) for (let k = 0; k < ch.length; k++) {
      this.buf[this.i++] = ch[k];
      if (this.i === this.n) { this.port.postMessage(this.buf.slice(0)); this.i = 0; }
    }
    return true;
  }
}
registerProcessor('cap', Cap);`;

async function start() {
  $('go').disabled = true;
  if (!window.isSecureContext || !navigator.mediaDevices) {
    status('Открой страницу по https:// — иначе телефон не даст микрофон');
    $('go').disabled = false; return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      channelCount: 1, echoCancellation: false, noiseSuppression: true, autoGainControl: true } });  // без эхоподавления телефон не врубает «громкую связь»
  } catch (e) {
    status('Нет доступа к микрофону: ' + e.message + '. Разреши в настройках сайта (замок слева от адреса).');
    $('go').disabled = false; return;
  }
  ctx = new AudioContext({ latencyHint: 'interactive' });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, 'cap', { processorOptions: { n: Math.round(ctx.sampleRate / 20) } });
  node.port.onmessage = e => {
    if (!ws || ws.readyState !== 1) return;
    const f = e.data, b = new Int16Array(f.length);
    let peak = 0;
    for (let i = 0; i < f.length; i++) { const v = Math.max(-1, Math.min(1, f[i])); b[i] = v * 32767; peak = Math.max(peak, Math.abs(v)); }
    ws.send(b.buffer);
    $('dot').style.transform = 'scale(' + (1 + Math.min(peak * 3, 1)) + ')';
  };
  const mute = ctx.createGain(); mute.gain.value = 0;
  src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  out = ctx.createGain(); out.connect(ctx.destination); setVol();
  $('go').style.display = 'none'; $('talk').style.display = 'block';
  $('stop').disabled = $('camBtn').disabled = $('look').disabled = false;
  $('smart').disabled = $('mute').disabled = $('send').disabled = false;
  $('glassesBtn').disabled = false;
  keepAwake();
  connect();
}

async function connect() {
  status('Подключаюсь к Васе...'); dot('');
  try {
    const r = await fetch('/check?k=' + encodeURIComponent(KEY), { cache: 'no-store' });
    if (r.status === 403) {
      dot('off');
      status(KEY ? 'Ключ не подошёл — вставь правильный' : 'Нужен ключ — вставь его (или открой ссылку с ?k=)');
      store('vasya_key', ''); KEY = '';
      askKey();
      return;                                   // без ключа долбиться смысла нет
    }
  } catch (e) { dot('off'); status('Сервер не отвечает — переподключаюсь...'); setTimeout(connect, 3000); return; }
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?k=' + encodeURIComponent(KEY));
  let opened = false;
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { opened = true; ws.send(JSON.stringify({ type: 'hello', rate: ctx.sampleRate })); dot('on');
    ws.send(JSON.stringify({ type: 'glasses_status' }));
    if (muted) { ws.send(JSON.stringify({ type: 'mute', on: true })); $('mute').classList.add('on'); $('mute').textContent = 'Звук выкл'; } };
  ws.onmessage = e => {
    if (typeof e.data !== 'string') { play(e.data); return; }
    const m = JSON.parse(e.data);
    if (m.type === 'log') { addLog(m.who, m.text); if (muted && m.who !== 'Ты' && navigator.vibrate) navigator.vibrate(25); }
    else if (m.type === 'status') status(m.text);
    else if (m.type === 'glasses_status') {
      const active = !!m.selected, online = !!m.online;
      $('glassesBtn').classList.toggle('on', active);
      $('glassesBtn').textContent = active ? '📷 Очки: вкл' : '📷 Очки: выкл';
      $('glassesInfo').textContent = active
        ? (online ? 'Фото: очки (онлайн)' : 'Очки не в сети — резерв: телефон')
        : 'Фото: телефон';
    }
    else if (m.type === 'stop') stopAudio();
    else if (m.type === 'snap') sendPhoto(m.id, false);
    else if (m.type === 'wake') wakeBeep();
    else if (m.type === 'speak') speakLocal(m.text);
    else if (m.type === 'cfg') { BG_INT = m.bg_interval || 30; $('bg').disabled = !m.bg_ok;
                                 if (m.bg_ok && !bgOn && store('vasya_bg') === '1') toggleBg(); }
  };
  ws.onclose = () => {
    dot('off');
    $('glassesInfo').textContent = 'Нет связи с сервером';
    status(opened || KEY ? 'Нет связи с Васей — переподключаюсь...' : 'Нужна ссылка с ключом (?k=...) — возьми её из окна установки');
    setTimeout(connect, 3000);
  };
}

// голос приходит кусками mp3 (по предложению); раскодируем строго по очереди
let muted = store('vasya_mute') === '1';
function play(buf) {
  if (muted) return;                             // «Без звука» — только текст на экране
  if (performance.now() < mutedUntil) return;   // хвост ответа, который уже велели заткнуть
  if (ctx.state === 'suspended') ctx.resume();
  const myStop = stopCount;
  chain = chain.then(() => ctx.decodeAudioData(buf)).then(ab => {
    if (myStop !== stopCount) return;
    const s = ctx.createBufferSource();
    s.buffer = ab; s.connect(out);
    const t = Math.max(ctx.currentTime + 0.05, nextT);
    s.start(t); nextT = t + ab.duration;
    sources.push(s); dot('talk');
    s.onended = () => { sources = sources.filter(x => x !== s); if (!sources.length) idle(); };
  }).catch(e => console.warn('mp3', e));
}
// окошко для ключа, если открыли без ссылки
function askKey() {
  if ($('keybox')) return;
  const box = document.createElement('div');
  box.id = 'keybox'; box.className = 'row';
  box.innerHTML = '<input id="keyin" placeholder="ключ из установки" autocomplete="off" ' +
    'style="flex:2;font:16px system-ui;padding:14px;border-radius:14px;border:1px solid #444;background:#1b1d21;color:#eef0f3">' +
    '<button id="keyok" style="flex:1">ОК</button>';
  $('log').before(box);
  $('keyok').onclick = () => {
    let v = $('keyin').value.trim();
    const m = v.match(/[?&]k=([^&\s]+)/); if (m) v = m[1];   // можно вставить всю ссылку целиком
    if (!v) return;
    KEY = v; store('vasya_key', v); box.remove(); connect();
  };
}
function idle() {
  dot('on');
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'idle' }));
}
// запасной голос — если сервер не смог озвучить, говорит сам телефон
function speakLocal(text) {
  if (muted) return;
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU'; u.pitch = 1.5; u.rate = 1.15; u.volume = Math.pow(+$('vol').value / 100, 2);
  speechQ++; dot('talk');
  u.onend = u.onerror = () => { if (--speechQ <= 0) { speechQ = 0; idle(); } };
  speechSynthesis.speak(u);
}

function setVol() {
  const v = +$('vol').value / 100;
  store('vasya_vol', $('vol').value);
  if (out) out.gain.value = v * v;          // квадрат — ползунок ощущается ровнее
}

// ---- камера: задняя, по запросу или постоянно с превью
async function openCam() {
  if (cam) return;
  cam = await navigator.mediaDevices.getUserMedia({ video: {
    facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  $('cam').srcObject = cam;
  await $('cam').play();
}
function closeCam() {
  if (cam) cam.getTracks().forEach(t => t.stop());
  cam = null; $('cam').srcObject = null;
}
async function sendPhoto(id, ask) {
  let data = null, error = null;
  try {
    const wasOpen = !!cam;
    status('Смотрю...');
    await openCam();
    const v = $('cam');
    for (let i = 0; i < 40 && !(v.videoWidth > 0 && v.readyState >= 2); i++) await sleep(100);
    if (!wasOpen) await sleep(1500);         // дать камере навестись и выставить свет
    if (!v.videoWidth) throw new Error('камера не дала кадр');
    const c = document.createElement('canvas');
    const k = Math.min(1, 1920 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    data = c.toDataURL('image/jpeg', 0.85);
    if (data.length < 5000) throw new Error('кадр пустой, попробуй ещё раз');
    addLog('Камера', ask ? 'Глянь, чё тут' : 'Сфоткал', data);
  } catch (e) { data = null; error = e.message; status('Камера: ' + e.message); }
  if (!camOn && !bgOn) closeCam();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'photo', id, ask, data, error }));
}

// «дзынь» как у Алисы — значит, услышал имя и ждёт вопрос
function wakeBeep() {
  if (!ctx) return;
  if (navigator.vibrate) navigator.vibrate(40);
  dot('wake'); status('Слушаю! Говори');
  const t = ctx.currentTime + 0.02, g = ctx.createGain();
  g.connect(out);
  [[660, 0], [990, 0.09]].forEach(([f, d]) => {
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = f; o.connect(g);
    o.start(t + d); o.stop(t + d + 0.09);
  });
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  setTimeout(() => { if ($('dot').className === 'wake') dot('on'); }, 8000);
}

let stopCount = 0;
function stopAudio() {
  stopCount++;
  sources.forEach(s => { try { s.stop(); } catch (e) {} });
  sources = []; nextT = 0; dot('on');
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speechQ = 0;
}

async function keepAwake() {
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && ctx) { keepAwake(); if (ctx.state === 'suspended') ctx.resume(); }
});
$('go').onclick = start;
$('vol').value = store('vasya_vol') || 20;
$('vol').oninput = setVol;
$('camBtn').onclick = async () => {
  camOn = !camOn;
  $('camBtn').classList.toggle('on', camOn); $('cam').classList.toggle('on', camOn);
  if (camOn) { try { await openCam(); } catch (e) { camOn = false; status('Камера не открылась: ' + e.message); } }
  else if (!bgOn) closeCam();
};

// ---- фон: раз в BG_INT секунд маленький кадр, но только если картинка заметно поменялась
async function toggleBg() {
  bgOn = !bgOn;
  store('vasya_bg', bgOn ? '1' : '');
  $('bg').classList.toggle('on', bgOn);
  clearInterval(bgTimer); lastThumb = null;
  if (bgOn) {
    try { await openCam(); } catch (e) { bgOn = false; $('bg').classList.remove('on'); status('Камера: ' + e.message); return; }
    bgTimer = setInterval(bgShot, BG_INT * 1000);
    setTimeout(bgShot, 2500);
  } else if (!camOn) closeCam();
}
function bgShot() {
  if (!bgOn || !cam || !ws || ws.readyState !== 1) return;
  const v = $('cam');
  if (!v.videoWidth) return;
  const t = document.createElement('canvas'); t.width = t.height = 16;
  const tc = t.getContext('2d', { willReadFrequently: true });
  tc.drawImage(v, 0, 0, 16, 16);
  const d = tc.getImageData(0, 0, 16, 16).data, g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = (d[4 * i] + d[4 * i + 1] + d[4 * i + 2]) / 3;
  if (lastThumb) {
    let diff = 0;
    for (let i = 0; i < 256; i++) diff += Math.abs(g[i] - lastThumb[i]);
    if (diff / 256 < 12) return;                 // почти ничего не поменялось — не тратим деньги
  }
  lastThumb = g;
  const k = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  ws.send(JSON.stringify({ type: 'bg', data: c.toDataURL('image/jpeg', 0.7) }));
}
$('bg').onclick = toggleBg;
// ---- «Держи и говори»: пока держишь — всё сказанное идёт Васе, без имени
function ptt(on) {
  if ($('talk').classList.contains('down') === on) return;
  $('talk').classList.toggle('down', on);
  $('talk').textContent = on ? 'Говори...' : 'Держи и говори';
  if (on) { stopAudio(); if (navigator.vibrate) navigator.vibrate(30); }
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ptt', on }));
}
$('talk').addEventListener('pointerdown', e => { e.preventDefault(); $('talk').setPointerCapture(e.pointerId); ptt(true); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => $('talk').addEventListener(n, () => ptt(false)));
$('talk').addEventListener('contextmenu', e => e.preventDefault());
$('glassesBtn').onclick = () => {
  const next = !$('glassesBtn').classList.contains('on');
  wsSend({ type: 'glasses_select', on: next });
};
$('look').onclick = () => {
  stopAudio();
  if ($('glassesBtn').classList.contains('on')) {
    wsSend({ type: 'look' });
  } else {
    sendPhoto(0, true);
  }
};

// ---- молча: кнопка «Разберись», текст, «Без звука»
function wsSend(o) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } status('Нет связи с Васей'); return false; }
$('smart').onclick = () => { stopAudio(); if (navigator.vibrate) navigator.vibrate(30); wsSend({ type: 'smart' }); status('Смотрю, чем помочь...'); };
function sendText() {
  const t = $('txt').value.trim();
  if (!t) return;
  if (wsSend({ type: 'text', text: t })) { $('txt').value = ''; stopAudio(); }
}
$('send').onclick = sendText;
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendText(); } });
function setMute(on) {
  muted = on; store('vasya_mute', on ? '1' : '');
  $('mute').classList.toggle('on', on); $('mute').textContent = on ? 'Звук выкл' : 'Без звука';
  if (on) stopAudio();
  wsSend({ type: 'mute', on });
}
$('mute').onclick = () => setMute(!muted);
$('stop').onclick = () => {
  mutedUntil = performance.now() + 700;
  stopAudio();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'stop' }));
};
</script>
</body>
</html>
