name: Glasses bridge checks
on:
  pull_request:
    paths:
      - glasses_bridge.py
      - server.py
      - static/index.html
      - tests/**
      - .github/workflows/glasses.yml
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install aiohttp
      - run: python -m compileall -q glasses_bridge.py server.py
      - run: python -m unittest discover -s tests -v
